# ============================================
# NAME: Nombre del workflow (aparece en la UI de GitHub)
# ============================================
name: CI/CD Pipeline

# ============================================
# ON: Triggers (¿Cuándo se ejecuta?)
# ============================================
on:
  push:
    branches:
      - main  # Solo se ejecuta cuando hay push a 'main'
    paths:
      - 'src/**'  # Solo si hay cambios en la carpeta 'src'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la UI

# ============================================
# JOBS: Los trabajos que se ejecutan
# ============================================
jobs:
  # --- JOB 1: BUILD ---
  build:
    name: Compilar y Validar
    runs-on: ubuntu-latest  # Máquina virtual con Linux
    steps:
      # STEP 1: Checkout del código
      - name: Descargar código del repositorio
        uses: actions/checkout@v3  # Action oficial de GitHub para clonar el repo
      
      # STEP 2: Ejecutar comandos de shell
      - name: Validar estructura del proyecto
        run: |
          echo "✅ Iniciando proceso de build..."
          echo "📂 Listando archivos del proyecto:"
          ls -la
          echo "📄 Contenido del archivo HTML:"
          cat src/index.html
      
      # STEP 3: Simular pruebas
      - name: Ejecutar pruebas
        run: |
          echo "🧪 Ejecutando pruebas simuladas..."
          echo "✅ Test 1: El archivo index.html existe"
          echo "✅ Test 2: El archivo tiene contenido válido"
          echo "🎉 Todas las pruebas pasaron"

  # --- JOB 2: DEPLOY ---
  deploy:
    name: Desplegar a Producción
    runs-on: ubuntu-latest
    needs: build  # Este job solo se ejecuta si 'build' fue exitoso
    if: success()  # Condición explícita
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3
      
      - name: Desplegar aplicación
        run: |
          echo "🚀 Iniciando despliegue..."
          echo "📦 Empaquetando archivos..."
          echo "☁️ Subiendo a servidor de producción..."
          echo "✅ Despliegue completado exitosamente"